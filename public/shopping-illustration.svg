<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="podium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#1f7a4d"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12281f"/>
      <stop offset="100%" stop-color="#0a1a14"/>
    </linearGradient>
  </defs>

  <!-- soft background circle -->
  <circle cx="200" cy="190" r="170" fill="#f7f5f0"/>

  <!-- podium -->
  <ellipse cx="200" cy="330" rx="120" ry="18" fill="url(#podium)"/>
  <rect x="80" y="300" width="240" height="30" rx="15" fill="url(#podium)"/>

  <!-- floating boxes (back) -->
  <g>
    <rect x="55" y="150" width="46" height="46" rx="4" fill="#d4b896"/>
    <rect x="55" y="150" width="46" height="14" rx="4" fill="#1f7a4d" opacity=".5"/>
  </g>
  <g>
    <rect x="300" y="190" width="40" height="40" rx="4" fill="#d4b896"/>
    <rect x="300" y="190" width="40" height="12" rx="4" fill="#1f7a4d" opacity=".5"/>
  </g>

  <!-- phone -->
  <rect x="150" y="60" width="100" height="200" rx="16" fill="url(#phoneBody)"/>
  <rect x="158" y="76" width="84" height="168" rx="4" fill="#1f7a4d"/>

  <!-- status bar dots -->
  <circle cx="170" cy="88" r="2.5" fill="#f7f5f0"/>
  <circle cx="178" cy="88" r="2.5" fill="#f7f5f0"/>

  <!-- basket on screen -->
  <path d="M182 150 L218 150 L212 178 L188 178 Z" fill="#f7f5f0"/>
  <rect x="182" y="144" width="36" height="8" rx="2" fill="#0a1a14"/>
  <line x1="188" y1="154" x2="192" y2="174" stroke="#1f7a4d" stroke-width="2"/>
  <line x1="200" y1="154" x2="200" y2="174" stroke="#1f7a4d" stroke-width="2"/>
  <line x1="212" y1="154" x2="208" y2="174" stroke="#1f7a4d" stroke-width="2"/>

  <!-- small box on top of basket -->
  <rect x="196" y="122" width="26" height="26" rx="3" fill="#d4b896" transform="rotate(8 209 135)"/>

  <!-- buy button -->
  <rect x="180" y="190" width="40" height="14" rx="7" fill="#0a1a14"/>
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="8" fill="#d4b896" text-anchor="middle" font-weight="700">BUY</text>

  <!-- receipt curling out of the phone -->
  <path d="M206 214 C 230 224, 250 214, 260 234 L 280 300 L 210 300 Z" fill="#f7f5f0" stroke="#e7e3da"/>
  <line x1="222" y1="244" x2="266" y2="244" stroke="#1f7a4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="220" y1="256" x2="270" y2="256" stroke="#6b7a72" stroke-width="2" stroke-linecap="round"/>
  <line x1="220" y1="266" x2="270" y2="266" stroke="#6b7a72" stroke-width="2" stroke-linecap="round"/>
  <line x1="220" y1="276" x2="260" y2="276" stroke="#6b7a72" stroke-width="2" stroke-linecap="round"/>

  <!-- floating box (front, bigger) -->
  <g>
    <rect x="66" y="252" width="54" height="54" rx="5" fill="#d4b896"/>
    <rect x="66" y="252" width="54" height="16" rx="5" fill="#1f7a4d" opacity=".5"/>
    <line x1="93" y1="252" x2="93" y2="306" stroke="#12281f" stroke-width="1.5" opacity=".3"/>
  </g>
</svg>
